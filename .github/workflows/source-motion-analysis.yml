name: Source motion decomposition

on:
  push:
    branches:
      - develop
      - feature/left-motion-decomposition-v1
    paths:
      - .github/workflows/source-motion-analysis.yml
      - tools/analyze_source_motion.py
      - tests/test_source_motion.py
      - assets/animations/left-frames.zip
      - assets/animations/analysis/left.motion.json
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/source-motion-analysis.yml
      - tools/analyze_source_motion.py
      - tests/test_source_motion.py
      - assets/animations/left-frames.zip
      - assets/animations/analysis/left.motion.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow
      - name: Test synthetic and real PNG sequences
        run: python -m unittest discover -s tests -p 'test_source_motion.py' -v
      - name: Generate and verify source-motion JSON
        run: |
          python tools/analyze_source_motion.py
          python tools/analyze_source_motion.py --check
      - name: Commit the generated profile on the feature branch
        if: github.ref_name == 'feature/left-motion-decomposition-v1' && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/animations/analysis/left.motion.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: generate left movement profile [skip ci]'
            git push
          fi
      - name: Verify committed profile outside the feature branch
        if: github.ref_name != 'feature/left-motion-decomposition-v1' || github.event_name != 'push'
        run: git diff --exit-code -- assets/animations/analysis/left.motion.json
