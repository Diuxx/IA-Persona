name: Motion Estimation V2

on:
  push:
    branches:
      - research/motion-estimation-v2
    paths:
      - research/**
      - .github/workflows/motion-estimation.yml
      - assets/animations/*-targets.js
      - assets/persona-map.js
      - assets/persona-anatomy.js
      - src/animation/target-animation-codec.js
      - src/engine/**
      - tools/motion_analysis/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: node --test tests/*.test.cjs
      - run: python -m unittest discover -s research/tests -v
      - run: node --check research/export_clip.cjs
      - run: node --check research/estimation/viewer/viewer.js
      - run: python research/estimate.py
      - uses: actions/upload-artifact@v4
        with:
          name: motion-estimation-v2
          path: research/output/estimation/
          if-no-files-found: error
