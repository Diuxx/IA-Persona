name: Motion Lab V1

on:
  push:
    branches:
      - research/motion-lab-v1
    paths:
      - research/**
      - .github/workflows/motion-lab.yml
      - tools/motion_analysis/decoder.cjs
      - assets/animations/idle-targets.js
      - assets/persona-map.js
      - assets/persona-anatomy.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: node --test tests/*.test.cjs
      - run: python -m unittest discover -s research/tests -v
      - run: python research/run.py --frame 20
      - uses: actions/upload-artifact@v4
        with:
          name: idle-motion-lab
          path: research/output/
          if-no-files-found: error
