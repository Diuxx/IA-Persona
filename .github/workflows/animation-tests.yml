name: Animation regression tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/animations/*-targets.js'
      - 'index.html'
      - '.github/workflows/animation-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/animations/*-targets.js'
      - 'index.html'
      - '.github/workflows/animation-tests.yml'

permissions:
  contents: read

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/engine/particle-world.js
          node --check src/animation/target-animation-codec.js
          node --check src/animation/target-animation-player.js
          node --check src/controller/behavior-controller.js
          node --check src/app.js
      - name: Run regression tests
        run: node --test tests/*.test.cjs
